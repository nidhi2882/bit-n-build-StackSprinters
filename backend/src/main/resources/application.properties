# MongoDB Cloud Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://bit_n_build:JayLadva123456@cluster0.sa3a4j2.mongodb.net/resqgrid?retryWrites=true&w=majority&appName=Cluster0}

# Relational / In-Memory Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resqgrid;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
