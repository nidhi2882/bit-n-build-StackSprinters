spring.application.name=backend
server.port=8080

# MongoDB Cloud Database Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/resqgrid}

# Relational / In-Memory Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resqgrid;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# HikariCP High-Performance Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Auto Table Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# JWT & Security Properties
app.jwt.secret=${JWT_SECRET:ResQGridSuperSecretKeyForJWTTokenGeneration2026!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI / LLM Integration
app.ai.llm-api-key=${LLM_API_KEY:your_llm_api_key_here}

# Logging
logging.level.com.resqgrid.backend=INFO
