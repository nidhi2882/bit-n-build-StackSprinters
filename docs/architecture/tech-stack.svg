<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <style>
      .title{fill:#f8fafc;font-size:30px;font-weight:700}
      .sub{fill:#94a3b8;font-size:15px}
      .col-t{fill:#f8fafc;font-size:19px;font-weight:700}
      .item{fill:#e2e8f0;font-size:14px}
      .item-s{fill:#94a3b8;font-size:11.5px}
      .chip{fill:#cbd5e1;font-size:12px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg2)"/>
  <text x="60" y="52" class="title">ResQGrid — Technology Stack</text>
  <text x="60" y="78" class="sub">Frameworks, libraries and infrastructure used across the three services</text>

  <!-- FRONTEND -->
  <rect x="60" y="110" width="350" height="600" rx="16" fill="#111c33" stroke="#3b82f6" stroke-opacity="0.5"/>
  <rect x="60" y="110" width="350" height="56" rx="16" fill="#1d4ed8"/>
  <text x="84" y="146" class="col-t">Frontend</text>
  <g transform="translate(84,196)">
    <text class="item" y="0">React 18</text><text class="item-s" y="18">Component-based SPA</text>
    <text class="item" y="52">Vite 8</text><text class="item-s" y="70">Dev server &amp; build tool</text>
    <text class="item" y="104">Tailwind CSS</text><text class="item-s" y="122">Material design tokens</text>
    <text class="item" y="156">React Router</text><text class="item-s" y="174">Role-based routing</text>
    <text class="item" y="208">Axios</text><text class="item-s" y="226">REST client + JWT interceptor</text>
    <text class="item" y="260">STOMP / SockJS</text><text class="item-s" y="278">Realtime telemetry feed</text>
    <text class="item" y="312">Lucide + Material Symbols</text><text class="item-s" y="330">Iconography</text>
    <text class="item" y="364">Custom SVG charts</text><text class="item-s" y="382">Donut, gauge, bars, trend line</text>
  </g>

  <!-- BACKEND -->
  <rect x="425" y="110" width="350" height="600" rx="16" fill="#0f2a20" stroke="#10b981" stroke-opacity="0.5"/>
  <rect x="425" y="110" width="350" height="56" rx="16" fill="#047857"/>
  <text x="449" y="146" class="col-t">Backend</text>
  <g transform="translate(449,196)">
    <text class="item" y="0">Java 17</text><text class="item-s" y="18">Language runtime</text>
    <text class="item" y="52">Spring Boot 2.7.18</text><text class="item-s" y="70">Application framework</text>
    <text class="item" y="104">Spring Web (REST)</text><text class="item-s" y="122">Controllers &amp; endpoints</text>
    <text class="item" y="156">Spring Security + JWT</text><text class="item-s" y="174">HMAC SHA-256, BCrypt</text>
    <text class="item" y="208">Spring Data JPA</text><text class="item-s" y="226">Hibernate ORM repositories</text>
    <text class="item" y="260">Spring WebSocket</text><text class="item-s" y="278">STOMP message broker</text>
    <text class="item" y="312">Spring Scheduling</text><text class="item-s" y="330">SLA breach / escalation jobs</text>
    <text class="item" y="364">Maven</text><text class="item-s" y="382">Build &amp; dependency mgmt</text>
  </g>

  <!-- AI -->
  <rect x="790" y="110" width="350" height="290" rx="16" fill="#2b1a08" stroke="#f59e0b" stroke-opacity="0.5"/>
  <rect x="790" y="110" width="350" height="56" rx="16" fill="#b45309"/>
  <text x="814" y="146" class="col-t">AI Microservice</text>
  <g transform="translate(814,196)">
    <text class="item" y="0">Python + FastAPI</text><text class="item-s" y="18">Async REST service (Uvicorn)</text>
    <text class="item" y="52">Google Gemini</text><text class="item-s" y="70">RAG copilot (gemini-flash-latest)</text>
    <text class="item" y="104">NLP classifier + severity engine</text><text class="item-s" y="122">Incident triage scoring</text>
    <text class="item" y="156">Duplicate matcher</text><text class="item-s" y="174">Spatial + temporal + semantic</text>
  </g>

  <!-- DATA + INFRA -->
  <rect x="790" y="420" width="350" height="290" rx="16" fill="#20143a" stroke="#a78bfa" stroke-opacity="0.5"/>
  <rect x="790" y="420" width="350" height="56" rx="16" fill="#6d28d9"/>
  <text x="814" y="456" class="col-t">Data &amp; Infra</text>
  <g transform="translate(814,506)">
    <text class="item" y="0">H2 Database</text><text class="item-s" y="18">In-memory, PostgreSQL mode</text>
    <text class="item" y="52">MongoDB Atlas</text><text class="item-s" y="70">Optional cloud sync mirror</text>
    <text class="item" y="104">Docker + docker-compose</text><text class="item-s" y="122">Containerized deployment</text>
    <text class="item" y="156">.env configuration</text><text class="item-s" y="174">Secrets, DB URLs, LLM key</text>
  </g>

  <!-- footer chips -->
  <g transform="translate(60,726)">
    <rect x="0" y="0" width="120" height="24" rx="12" fill="#1e293b"/><text x="60" y="16" class="chip" text-anchor="middle">JavaScript / JSX</text>
    <rect x="132" y="0" width="70" height="24" rx="12" fill="#1e293b"/><text x="167" y="16" class="chip" text-anchor="middle">Java</text>
    <rect x="214" y="0" width="80" height="24" rx="12" fill="#1e293b"/><text x="254" y="16" class="chip" text-anchor="middle">Python</text>
    <rect x="306" y="0" width="70" height="24" rx="12" fill="#1e293b"/><text x="341" y="16" class="chip" text-anchor="middle">SQL</text>
    <rect x="388" y="0" width="130" height="24" rx="12" fill="#1e293b"/><text x="453" y="16" class="chip" text-anchor="middle">REST + WebSocket</text>
  </g>
</svg>
