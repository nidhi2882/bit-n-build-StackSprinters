<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  
  <!-- Header Title -->
  <text x="600" y="45" font-size="26" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">ResQGrid — Production System Architecture</text>
  <text x="600" y="70" font-size="14" fill="#94a3b8" text-anchor="middle">Bit N Build 2026 · PS-9 · Team Stack Sprinters</text>

  <!-- Section 1: Emergency Data Sources (Top) -->
  <rect x="50" y="100" width="1100" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="70" y="125" font-size="14" font-weight="bold" fill="#38bdf8">EMERGENCY DATA SOURCES &amp; INGESTION GATEWAYS</text>

  <g transform="translate(70, 140)">
    <rect width="180" height="45" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="27" font-size="13" fill="#e2e8f0" text-anchor="middle">📱 Citizen Web &amp; PWA</text>
  </g>
  <g transform="translate(280, 140)">
    <rect width="180" height="45" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="27" font-size="13" fill="#fca5a5" text-anchor="middle">🚨 1-Tap SOS Panic</text>
  </g>
  <g transform="translate(490, 140)">
    <rect width="180" height="45" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <text x="90" y="27" font-size="13" fill="#fde047" text-anchor="middle">📞 911 Operator Form</text>
  </g>
  <g transform="translate(700, 140)">
    <rect width="180" height="45" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="27" font-size="13" fill="#6ee7b7" text-anchor="middle">📡 IoT Water/Smoke Feeds</text>
  </g>
  <g transform="translate(910, 140)">
    <rect width="180" height="45" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="90" y="27" font-size="13" fill="#c4b5fd" text-anchor="middle">🏥 Hospital ICU Telemetry</text>
  </g>

  <!-- Connectors from Ingestion to API -->
  <line x1="600" y1="200" x2="600" y2="240" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="600,245 594,235 606,235" fill="#06b6d4" />

  <!-- Section 2: Core Backend API & Gateway -->
  <rect x="50" y="245" width="1100" height="240" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
  <text x="70" y="275" font-size="15" font-weight="bold" fill="#38bdf8">NESTJS / SPRING BOOT BACKEND API &amp; SERVICE ORCHESTRATION</text>

  <!-- Sub-modules inside API -->
  <g transform="translate(70, 295)">
    <rect width="240" height="80" rx="8" fill="#0f172a" stroke="#3b82f6"/>
    <text x="120" y="25" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">Auth &amp; CASL RBAC/ABAC</text>
    <text x="120" y="48" font-size="11" fill="#94a3b8" text-anchor="middle">Argon2id · JWT · Scoped Guards</text>
    <text x="120" y="65" font-size="11" fill="#94a3b8" text-anchor="middle">Dept Containment Filter</text>
  </g>

  <g transform="translate(340, 295)">
    <rect width="240" height="80" rx="8" fill="#0f172a" stroke="#3b82f6"/>
    <text x="120" y="25" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">Incident Lifecycle Engine</text>
    <text x="120" y="48" font-size="11" fill="#94a3b8" text-anchor="middle">Report Ingestion · Master Merge</text>
    <text x="120" y="65" font-size="11" fill="#94a3b8" text-anchor="middle">Status Transitions · Audit Logs</text>
  </g>

  <g transform="translate(610, 295)">
    <rect width="240" height="80" rx="8" fill="#0f172a" stroke="#3b82f6"/>
    <text x="120" y="25" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">Resource Dispatcher &amp; OSRM</text>
    <text x="120" y="48" font-size="11" fill="#94a3b8" text-anchor="middle">Capability Matching · Road ETA</text>
    <text x="120" y="65" font-size="11" fill="#94a3b8" text-anchor="middle">Load-balanced Unit Bundles</text>
  </g>

  <g transform="translate(880, 295)">
    <rect width="240" height="80" rx="8" fill="#0f172a" stroke="#ef4444"/>
    <text x="120" y="25" font-size="14" font-weight="bold" fill="#fca5a5" text-anchor="middle">Targeted Notification Hub</text>
    <text x="120" y="48" font-size="11" fill="#94a3b8" text-anchor="middle">Twilio SMS · SendGrid Email</text>
    <text x="120" y="65" font-size="11" fill="#94a3b8" text-anchor="middle">FCM Mobile Push · Web Broadcast</text>
  </g>

  <g transform="translate(70, 390)">
    <rect width="510" height="75" rx="8" fill="#0f172a" stroke="#06b6d4"/>
    <text x="255" y="25" font-size="14" font-weight="bold" fill="#22d3ee" text-anchor="middle">Socket.IO / STOMP Real-Time Gateway</text>
    <text x="255" y="48" font-size="12" fill="#94a3b8" text-anchor="middle">Scoped Rooms: authority:{id} · dept:{id} · unit:{id}</text>
    <text x="255" y="63" font-size="11" fill="#64748b" text-anchor="middle">Zero noise cross-talk between Fire, Flood &amp; Police</text>
  </g>

  <g transform="translate(610, 390)">
    <rect width="510" height="75" rx="8" fill="#0f172a" stroke="#f97316"/>
    <text x="255" y="25" font-size="14" font-weight="bold" fill="#fb923c" text-anchor="middle">BullMQ SLA Escalation Scheduler</text>
    <text x="255" y="48" font-size="12" fill="#94a3b8" text-anchor="middle">P1 Critical Timer (5m) · P2 Severe Timer (15m)</text>
    <text x="255" y="63" font-size="11" fill="#64748b" text-anchor="middle">Auto-escalates unassigned alerts to Dept/Authority Chief</text>
  </g>

  <!-- Connectors to AI & Data Layer -->
  <line x1="300" y1="485" x2="300" y2="525" stroke="#a855f7" stroke-width="3"/>
  <polygon points="300,530 294,520 306,520" fill="#a855f7" />

  <line x1="900" y1="485" x2="900" y2="525" stroke="#10b981" stroke-width="3"/>
  <polygon points="900,530 894,520 906,520" fill="#10b981" />

  <!-- Section 3: AI Microservice & Data Tier (Middle-Bottom) -->
  <g transform="translate(50, 530)">
    <!-- AI Service Box -->
    <rect width="520" height="150" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="bold" fill="#c084fc">PYTHON 3.11 FASTAPI AI MICROSERVICE</text>

    <rect x="20" y="42" width="230" height="42" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="135" y="67" font-size="12" fill="#e2e8f0" text-anchor="middle">🤖 NLP Classification &amp; Severity</text>

    <rect x="270" y="42" width="230" height="42" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="135" y="67" font-size="12" fill="#e2e8f0" text-anchor="middle">🔍 3-Signal Duplicate Detection</text>

    <rect x="20" y="94" width="230" height="42" rx="6" fill="#0f172a" stroke="#ec4899"/>
    <text x="135" y="119" font-size="12" fill="#e2e8f0" text-anchor="middle">📷 Computer Vision Damage Triage</text>

    <rect x="270" y="94" width="230" height="42" rx="6" fill="#0f172a" stroke="#ec4899"/>
    <text x="135" y="119" font-size="12" fill="#e2e8f0" text-anchor="middle">💬 RAG Operational Copilot</text>
  </g>

  <g transform="translate(630, 530)">
    <!-- Data Persistence Box -->
    <rect width="520" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="28" font-size="15" font-weight="bold" fill="#34d399">DATABASE, CACHE &amp; GEOSPATIAL STORAGE</text>

    <rect x="20" y="42" width="230" height="45" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="135" y="62" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">MongoDB 7.0 / PostGIS</text>
    <text x="135" y="77" font-size="10" fill="#94a3b8" text-anchor="middle">2Dsphere Spatial Indexing · GeoJSON</text>

    <rect x="270" y="42" width="230" height="45" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="135" y="62" font-weight="bold" font-size="12" fill="#6ee7b7" text-anchor="middle">pgvector / Vector Search</text>
    <text x="135" y="77" font-size="10" fill="#94a3b8" text-anchor="middle">Report Text Embedding Vectors</text>

    <rect x="20" y="96" width="230" height="42" rx="6" fill="#0f172a" stroke="#f97316"/>
    <text x="135" y="121" font-size="12" fill="#fdba74" text-anchor="middle">⚡ Redis 7 Cache &amp; PubSub</text>

    <rect x="270" y="96" width="230" height="42" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="135" y="121" font-size="12" fill="#7dd3fc" text-anchor="middle">📦 S3 / MinIO Media Storage</text>
  </g>

  <!-- Section 4: Client Consoles & Frontends (Bottom) -->
  <rect x="50" y="700" width="1100" height="75" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="70" y="725" font-size="13" font-weight="bold" fill="#7dd3fc">CLIENT APPLICATIONS &amp; CONSOLES</text>

  <g transform="translate(70, 735)">
    <rect width="250" height="30" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="125" y="20" font-size="12" fill="#f1f5f9" text-anchor="middle">🖥️ Command Center CAD (React 19 + MapLibre)</text>
  </g>
  <g transform="translate(345, 735)">
    <rect width="250" height="30" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="125" y="20" font-size="12" fill="#f1f5f9" text-anchor="middle">🏢 Scoped Dept Admin Consoles</text>
  </g>
  <g transform="translate(620, 735)">
    <rect width="240" height="30" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="120" y="20" font-size="12" fill="#f1f5f9" text-anchor="middle">📱 First Responder Mobile App (Expo)</text>
  </g>
  <g transform="translate(875, 735)">
    <rect width="255" height="30" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="127" y="20" font-size="12" fill="#f1f5f9" text-anchor="middle">🏥 Hospital Capacity Telemetry Board</text>
  </g>
</svg>
