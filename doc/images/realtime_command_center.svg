<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#090d16; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0b0f19" />

  <!-- Top App Bar -->
  <rect width="1200" height="55" fill="#1e293b" />
  <text x="25" y="35" font-size="18" font-weight="bold" fill="#38bdf8">🚨 ResQGrid CAD — Command Center Radar</text>
  
  <rect x="700" y="12" width="150" height="30" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="775" y="32" font-size="12" font-weight="bold" fill="#fca5a5" text-anchor="middle">🚨 4 Active P1 Incidents</text>

  <rect x="865" y="12" width="150" height="30" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="940" y="32" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">🚒 18 Units On Duty</text>

  <circle cx="1040" cy="27" r="8" fill="#10b981" />
  <text x="1055" y="31" font-size="12" fill="#94a3b8">WS Connected</text>

  <!-- Left Sidebar: Live Incident Feed -->
  <rect x="15" y="70" width="320" height="715" rx="8" fill="#131c2e" stroke="#1e293b"/>
  <text x="30" y="98" font-size="15" font-weight="bold" fill="#f8fafc">Live Incident Feed</text>

  <!-- Incident Item 1 (Critical) -->
  <rect x="25" y="115" width="300" height="110" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <rect x="35" y="125" width="70" height="22" rx="4" fill="#ef4444"/>
  <text x="70" y="140" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">P1 CRITICAL</text>
  <text x="115" y="140" font-size="12" font-weight="bold" fill="#f8fafc">Flash Flood Sector 4</text>
  <text x="35" y="165" font-size="11" fill="#94a3b8">📍 19.0760 N, 72.8777 E (Riverbank)</text>
  <text x="35" y="185" font-size="11" fill="#94a3b8">⏱️ SLA Timer: 03:12 remaining</text>
  <text x="35" y="205" font-size="11" fill="#38bdf8">🔗 4 Merged Citizen Reports</text>

  <!-- Incident Item 2 (Severe) -->
  <rect x="25" y="240" width="300" height="100" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <rect x="35" y="250" width="70" height="22" rx="4" fill="#f97316"/>
  <text x="70" y="265" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">P2 SEVERE</text>
  <text x="115" y="265" font-size="12" font-weight="bold" fill="#f8fafc">Structural Fire - Mill 3</text>
  <text x="35" y="290" font-size="11" fill="#94a3b8">📍 Industrial Area Plot 14</text>
  <text x="35" y="310" font-size="11" fill="#6ee7b7">🚒 Engine-4 &amp; Ladder-1 Dispatched</text>

  <!-- Incident Item 3 (Moderate) -->
  <rect x="25" y="355" width="300" height="100" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1"/>
  <rect x="35" y="365" width="75" height="22" rx="4" fill="#eab308"/>
  <text x="72" y="380" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">P3 MODERATE</text>
  <text x="120" y="380" font-size="12" font-weight="bold" fill="#f8fafc">Highway Pile-up</text>
  <text x="35" y="405" font-size="11" fill="#94a3b8">📍 Highway Express KM 42</text>
  <text x="35" y="425" font-size="11" fill="#94a3b8">🚑 2 Ambulances en route</text>

  <!-- Center Area: MapLibre GIS Map Radar -->
  <rect x="350" y="70" width="520" height="715" rx="8" fill="#091322" stroke="#1e293b"/>
  
  <!-- Map Radar Circles & Grid -->
  <circle cx="610" cy="427" r="280" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="610" cy="427" r="190" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="610" cy="427" r="100" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Radar Scanning Effect line -->
  <line x1="610" y1="427" x2="780" y2="280" stroke="#06b6d4" stroke-width="2"/>

  <!-- Map Markers -->
  <!-- Flood Incident Pulse -->
  <circle cx="550" cy="380" r="14" fill="#ef4444" fill-opacity="0.3"/>
  <circle cx="550" cy="380" r="7" fill="#ef4444" />
  <text x="550" y="360" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">INC-892 (Flood)</text>

  <!-- Fire Incident -->
  <circle cx="680" cy="480" r="7" fill="#f97316" />
  <text x="680" y="465" font-size="11" font-weight="bold" fill="#fdba74" text-anchor="middle">INC-895 (Fire)</text>

  <!-- Responder Vehicle Icons -->
  <rect x="490" y="420" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="490" y="450" font-size="10" fill="#93c5fd">Boat-1 (0.8km)</text>

  <rect x="620" y="330" width="16" height="16" rx="3" fill="#10b981"/>
  <text x="620" y="320" font-size="10" fill="#6ee7b7">Ambu-4 (1.2km)</text>

  <text x="365" y="98" font-size="14" font-weight="bold" fill="#38bdf8">MapLibre GL JS — Live GIS Spatial Radar</text>

  <!-- Right Drawer: AI Operational Copilot -->
  <rect x="885" y="70" width="300" height="715" rx="8" fill="#131c2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="900" y="98" font-size="15" font-weight="bold" fill="#c084fc">🤖 AI Operational Copilot</text>
  <text x="900" y="118" font-size="11" fill="#94a3b8">Grounded RAG over SOPs &amp; Live GIS</text>

  <!-- Chat History -->
  <rect x="895" y="135" width="280" height="60" rx="8" fill="#1e293b"/>
  <text x="905" y="153" font-size="11" font-weight="bold" fill="#38bdf8">Dispatcher Question:</text>
  <text x="905" y="172" font-size="11" fill="#e2e8f0">"Recommend boat rescue units within 3km of Flood INC-892"</text>

  <rect x="895" y="205" width="280" height="230" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
  <text x="905" y="225" font-size="11" font-weight="bold" fill="#c084fc">AI Copilot Recommendation:</text>
  <text x="905" y="248" font-size="11" fill="#e2e8f0">• Unit Boat-1 (Inflatable Rescue)</text>
  <text x="905" y="265" font-size="11" fill="#94a3b8">  Distance: 0.8 km | ETA: 4 mins (OSRM)</text>
  <text x="905" y="282" font-size="11" fill="#94a3b8">  Status: AVAILABLE | Load: 0 active</text>
  
  <text x="905" y="305" font-size="11" fill="#e2e8f0">• Unit Boat-3 (Heavy Rescue Motorboat)</text>
  <text x="905" y="322" font-size="11" fill="#94a3b8">  Distance: 2.1 km | ETA: 9 mins (OSRM)</text>

  <text x="905" y="350" font-size="11" font-weight="bold" fill="#6ee7b7">Recommended Action Package:</text>
  <text x="905" y="368" font-size="11" fill="#e2e8f0">Dispatch Boat-1 + Ambu-4 to Riverbank</text>
  
  <!-- One-Click Dispatch Button -->
  <rect x="905" y="385" width="260" height="35" rx="6" fill="#059669"/>
  <text x="1035" y="407" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">⚡ One-Click Auto Dispatch Package</text>

  <!-- Bottom Input Box -->
  <rect x="895" y="730" width="280" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="910" y="754" font-size="12" fill="#64748b">Ask copilot operational question...</text>
</svg>
